# mypy for the Python tools (tools/). Strict except that unannotated functions are allowed: their
# bodies are still type-checked (strict implies check_untyped_defs).
[mypy]
python_version = 3.12
files = tools
strict = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False
