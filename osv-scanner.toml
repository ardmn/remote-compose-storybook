# OSV-Scanner: known vulnerabilities that are reviewed and do not apply. None at the moment.
#
# Prefer fixing the version (for the Kotlin Wasm yarn.lock, a resolution in build.gradle.kts). When
# an advisory really does not apply, ignore it for the one package it is about, with a reason and an
# effectiveUntil date after which CI fails again and the entry is re-checked:
#
# [[PackageOverrides]]
# name = "<package>"
# ecosystem = "npm"
# version = "<the affected version>"
# vulnerability.ignore = true
# effectiveUntil = 2027-01-01
# reason = "<why this advisory cannot affect this project>"
