# detekt on top of its default config (buildUponDefaultConfig). Only what differs from the defaults
# for this project is here; existing findings that are not fixed yet are in
# storybook/detekt-baseline-wasmJsMainSourceSet.xml.

naming:
  FunctionNaming:
    # Composable functions are PascalCase by Compose convention.
    ignoreAnnotated: ['Composable']

style:
  MagicNumber:
    # Stories are example code shown to users: their sizes, colors and durations are the point.
    excludes: ['**/stories/**']
  MaxLineLength:
    # ktfmt (kotlinlang style) owns line length; what it leaves longer are prose string literals
    # (plain-language descriptions), which it cannot break.
    active: false
