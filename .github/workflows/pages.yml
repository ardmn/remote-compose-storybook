name: Build, test and deploy the storybook

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_baselines:
        description: "Take new visual baselines (download the e2e-baselines artifact and commit it to e2e/baselines)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Kotlin (ktfmt, kotlinlang style)
        run: ./gradlew --console=plain :storybook:ktfmtCheck

      - name: Python (ruff)
        run: |
          pip install ruff==0.15.8
          ruff check tools
          ruff format --check tools

      - name: Shell (shellcheck)
        run: shellcheck scripts/*.sh

      - name: Workflows (actionlint)
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

      - name: JavaScript, CSS, HTML (eslint, prettier)
        working-directory: e2e
        run: |
          npm ci
          npm run lint

  verify-androidx:
    # The stories, as the Code tab shows them, compiled against AndroidX's own artifacts.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compile the stories against the AndroidX snapshot
        run: scripts/verify-androidx.sh

  build:
    needs: [lint, verify-androidx]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Build the site
        run: scripts/build-site.sh

      - name: Install the test browser
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # A page and a preview card per story, for links shared in chats and social networks.
      - name: Link previews
        working-directory: e2e
        run: node social.mjs

      - name: End-to-end test
        working-directory: e2e
        env:
          UPDATE_BASELINES: ${{ inputs.update_baselines && '--update-baselines' || '' }}
        run: node run.mjs ${UPDATE_BASELINES:+"$UPDATE_BASELINES"}

      - name: Upload new visual baselines
        if: inputs.update_baselines
        uses: actions/upload-artifact@v7
        with:
          name: e2e-baselines
          path: e2e/baselines

      - name: Upload e2e screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-out
          path: e2e/out
          if-no-files-found: ignore

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

  deploy:
    needs: build
    # Only deploys share a queue: a pull request can never replace a pending deploy from main.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
