name: Build, test and deploy the storybook

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_baselines:
        description: "Take new visual baselines (download the e2e-baselines artifact and commit it to e2e/baselines)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-lint.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # detekt findings that predate it are in storybook/detekt-baseline-wasmJsMainSourceSet.xml.
      - name: Kotlin (ktfmt, kotlinlang style; detekt)
        run: ./gradlew --console=plain :storybook:ktfmtCheck :storybook:detektWasmJsMainSourceSet

      - name: Python (ruff, mypy)
        run: |
          pip install --require-hashes -r tools/requirements-lint.txt
          ruff check tools
          ruff format --check tools
          mypy

      - name: Shell (shellcheck)
        run: shellcheck scripts/*.sh

      - name: Workflows (actionlint)
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -sSfL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/actionlint.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v$VERSION/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      # Reviewed HTML sinks carry an eslint-disable-next-line comment with the reason.
      - name: JavaScript, CSS, HTML (eslint, prettier, knip)
        working-directory: e2e
        run: |
          npm ci
          npm run lint

  secrets:
    # The deploy waits for this one (not the build, so pull requests still get their e2e result): a
    # secret comes from the commit itself, so it must stop the deploy before build/site is published.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks scans every commit reachable from the checked-out HEAD (--log-opts=HEAD), not
          # every fetched branch, so a stale branch cannot turn unrelated runs red.
          fetch-depth: 0

      - name: Secrets in the history (gitleaks)
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v$VERSION/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose --log-opts=HEAD .

  verify-androidx:
    # The stories, as the Code tab shows them, compiled against AndroidX's own artifacts.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compile the stories against the AndroidX snapshot
        run: scripts/verify-androidx.sh

  build:
    needs: [lint, verify-androidx]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Build the site
        run: scripts/build-site.sh

      - name: Install the test browser
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # A page and a preview card per story, for links shared in chats and social networks.
      - name: Link previews
        working-directory: e2e
        env:
          # Site ownership for the search engines' webmaster tools, once each is set up (repository variables).
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
          YANDEX_VERIFICATION: ${{ vars.YANDEX_VERIFICATION }}
        run: node social.mjs

      - name: End-to-end test
        working-directory: e2e
        env:
          UPDATE_BASELINES: ${{ inputs.update_baselines && '--update-baselines' || '' }}
        run: node run.mjs ${UPDATE_BASELINES:+"$UPDATE_BASELINES"}

      - name: Upload new visual baselines
        if: inputs.update_baselines
        uses: actions/upload-artifact@v7
        with:
          name: e2e-baselines
          path: e2e/baselines

      - name: Upload e2e screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-out
          path: e2e/out
          if-no-files-found: ignore

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

  deploy:
    needs: [build, secrets]
    # Only deploys share a queue: a pull request can never replace a pending deploy from main.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    # A manual run from main deploys too: the webmaster verification variables only reach the site
    # through a new build.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      # Tells Bing, Yandex and the other IndexNow engines which pages exist (the key is web/<key>.txt).
      # Never fails the deploy: the site is already live.
      - name: Notify search engines (IndexNow)
        continue-on-error: true
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          INDEXNOW_KEY: 22c69bedae44bc992d3d730320522f22
        run: |
          site="${PAGE_URL%/}/"
          host=$(echo "$site" | sed -E 's#^https?://([^/]+)/.*#\1#')
          curl -sSf --retry 5 --retry-delay 10 --retry-all-errors "${site}sitemap.xml" \
            | grep -o '<loc>[^<]*' | sed 's/<loc>//' \
            | jq -R . | jq -s --arg host "$host" --arg key "$INDEXNOW_KEY" --arg loc "${site}${INDEXNOW_KEY}.txt" \
              '{host: $host, key: $key, keyLocation: $loc, urlList: .}' \
            | curl -sS -o /dev/null -w "IndexNow: HTTP %{http_code}\n" \
              -H 'content-type: application/json; charset=utf-8' --data @- https://api.indexnow.org/indexnow
