name: Dependency advisories

# Separate from the build-and-deploy workflow: a newly published advisory must not block or mark
# failed a deploy of main, and the weekly run needs no guards on the deploy jobs. GitHub turns
# scheduled workflows off after 60 days without repository activity; re-enable it in the Actions
# tab if that happens.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The npm, Yarn, pip and Gradle lockfiles (e2e/, kotlin-js-store/, tools/, storybook/gradle.lockfile:
      # what ships in storybook.wasm); reviewed advisories are in osv-scanner.toml. Build tools (ktfmt,
      # detekt, compiler plugins) are not locked, so not scanned: they never reach the site.
      - name: Dependencies (OSV-Scanner)
        env:
          VERSION: 2.7.1
          SHA256: fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8
        run: |
          curl -sSfL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/osv-scanner" "https://github.com/google/osv-scanner/releases/download/v$VERSION/osv-scanner_linux_amd64"
          echo "$SHA256  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
          "$RUNNER_TEMP/osv-scanner" scan source --config osv-scanner.toml -r .
