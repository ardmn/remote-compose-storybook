[versions]
kotlin = "2.4.21"
compose-multiplatform = "1.12.2"
kotlinx-coroutines = "1.11.0"
# rc-players: the Compose Multiplatform port of AndroidX's creation API (package
# ee.schimke.composeai.rccreation) and the players. The Code tab shows the stories rewritten to
# AndroidX's packages; reference/androidx-api holds the AndroidX API they are checked against.
# Versioned through rc-players' BOM: a release republishes only the modules that changed, so the
# creation fork and the players can be on different versions (3.12.1 has creation at 3.10.0).
rc-players = "3.12.1"

[libraries]
rc-players-bom = { module = "ee.schimke.composeai:rc-players-bom", version.ref = "rc-players" }
rc-creation-compose = { module = "ee.schimke.composeai:rc-creation-compose" }
rc-creation-foundation = { module = "ee.schimke.composeai:rc-creation-foundation" }
rc-player-compose = { module = "ee.schimke.composeai:rc-player-compose" }
rc-player-embedded = { module = "ee.schimke.composeai:rc-player-embedded" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }

[plugins]
ktfmt = { id = "com.ncorti.ktfmt.gradle", version = "0.28.0" }
detekt = { id = "dev.detekt", version = "2.0.0-alpha.6" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
